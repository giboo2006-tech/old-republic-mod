# Builds the mod and runs its automated checks on every push and pull request.
# - build: compiles, runs server game tests (these boot a dedicated-server style game test
#   server with the mod loaded), and uploads the jar.
# - client-gametest: boots the real Minecraft client with the mod, creates a world and plays
#   through scripted steps. Screenshots are printed to the log as small base64 JPEGs so they can
#   be reviewed without downloading artifacts.
# - checks: the Milestone 3 and Milestone 4 id checks (docs/MILESTONE_3.md and MILESTONE_4.md,
#   15.1) and the check that no file belongs to two workers in either ownership table (15.2).

name: build
on: [pull_request, push]

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: check Milestone 3 ids
        run: python3 tools/check_m3_ids.py --report
      - name: check Milestone 4 ids
        run: python3 tools/check_m4_ids.py --report
      - name: check the Milestone 3 ownership table
        run: python3 tools/check_ownership.py --overlaps
      - name: check the Milestone 4 ownership table
        run: python3 tools/check_ownership.py --table tools/ownership_m4.json --overlaps

  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build and run server game tests
        run: ./gradlew build 
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/

  client-gametest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers imagemagick
      - name: run client game tests
        run: ./gradlew runClientGameTest 
      - name: print screenshots
        if: always()
        run: |
          for f in $(find build/run/clientGameTest/screenshots -name '*.png' 2>/dev/null | sort); do
            echo "=== SCREENSHOT $(basename "$f")"
            convert "$f" -resize 640x -quality 70 jpg:- | base64 -w 0
            echo
            echo "=== END SCREENSHOT"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Client game test screenshots
          path: build/run/clientGameTest/screenshots
